<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Online Bookstore</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <iframe
      src="top.html"
      name="topFrame"
      title="Top Frame"
      style="width: 100%; height: 126px; border: 0"
    >
    </iframe>
    <div style="display: grid; grid-template-columns: 190px 1fr">
      <iframe
        src="left.html"
        name="leftFrame"
        title="Left Frame"
        style="width: 100%; height: 100%; min-height: 650px; border: 0"
      ></iframe>
      <iframe
        src="home-content.html"
        name="rightFrame"
        title="Right Frame"
        style="width: 100%; height: 100%; min-height: 650px; border: 0"
      ></iframe>
    </div>
  </body>
</html>
