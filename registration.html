<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration - GreenLeaf Bookstore</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="content">
      <div class="card form-box">
        <h2>Registration Page</h2>
        <form>
          <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" placeholder="Enter your name" />
          </div>
          <div class="form-group">
            <label for="regPassword">Password</label>
            <input
              type="password"
              id="regPassword"
              placeholder="Enter your password"
            />
          </div>
          <div class="form-group">
            <label for="email">E-mail ID</label>
            <input type="email" id="email" placeholder="name@example.com" />
          </div>
          <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" placeholder="Enter 10 digit number" />
          </div>
          <div class="form-group">
            <label>Sex</label>
            <div class="inline">
              <label><input type="radio" name="sex" value="male" /> Male</label>
              <label
                ><input type="radio" name="sex" value="female" /> Female</label
              >
              <label
                ><input type="radio" name="sex" value="other" /> Other</label
              >
            </div>
          </div>
          <div class="form-group">
            <label>Date of Birth</label>
            <div class="inline">
              <select>
                <option>Day</option>
                <option>1</option>
                <option>2</option>
                <option>3</option>
                <option>4</option>
                <option>5</option>
                <option>6</option>
                <option>7</option>
                <option>8</option>
                <option>9</option>
                <option>10</option>
                <option>11</option>
                <option>12</option>
                <option>13</option>
                <option>14</option>
                <option>15</option>
                <option>16</option>
                <option>17</option>
                <option>18</option>
                <option>19</option>
                <option>20</option>
                <option>21</option>
                <option>22</option>
                <option>23</option>
                <option>24</option>
                <option>25</option>
                <option>26</option>
                <option>27</option>
                <option>28</option>
                <option>29</option>
                <option>30</option>
                <option>31</option>
              </select>
              <select>
                <option>Month</option>
                <option>January</option>
                <option>February</option>
                <option>March</option>
                <option>April</option>
                <option>May</option>
                <option>June</option>
                <option>July</option>
                <option>August</option>
                <option>September</option>
                <option>October</option>
                <option>November</option>
                <option>December</option>
              </select>
              <select>
                <option>Year</option>
                <option>2005</option>
                <option>2006</option>
                <option>2007</option>
                <option>2008</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label>Languages Known</label>
            <div class="inline">
              <label
                ><input type="checkbox" name="language" value="english" />
                English</label
              >
              <label
                ><input type="checkbox" name="language" value="telugu" />
                Telugu</label
              >
              <label
                ><input type="checkbox" name="language" value="hindi" />
                Hindi</label
              >
              <label
                ><input type="checkbox" name="language" value="tamil" />
                Tamil</label
              >
            </div>
          </div>
          <div class="form-group">
            <label for="address">Address</label>
            <textarea id="address" placeholder="Enter your address"></textarea>
          </div>
          <button class="btn" type="submit">Submit</button>
          <button class="btn" type="reset">Reset</button>
        </form>
      </div>
    </main>
  </body>
</html>
